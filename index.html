  <head>

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes"/>
    <title>AR PaylessXBINI</title>
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="stylesheet" href="TemplateData/CameraAssets/style-camera.css" />
    <style>
      html { height: -webkit-fill-available; }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        width: 100vw;
        overflow: hidden;
        background-color: #000; /* Hindari blink transparan */
      }
      .ctaDiv {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0; right: 0; top: 0; bottom: 0;
        background: #01ab01;
        z-index: 99;
      }
      /* Fade in/out smooth */
      .fade {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .fade.show {
        opacity: 1;
        pointer-events: all;
      }
    </style>
  </head>
  <body>
    <!-- Camera video (hidden) -->
    <video id="webcam-video" muted autoplay playsinline style="display:none;"></video>
    <!-- Orientation notice -->
    <div id="landscape-div" class="fade">
      <img id="landscape-div-img" src="./TemplateData/CameraAssets/img_best_view.png"/>
    </div>
    <!-- Start AR -->
    <div id="startARDiv" class="ctaDiv fade show">
      <select id="chooseCamSel" style="display: none" onchange="SelectCam()"></select>
      <img id="cameraLogoImageTop" src="TemplateData/CameraAssets/camera-logo-top.png" alt="" />
      <img id="cameraTextImage" src="TemplateData/CameraAssets/camera-text.png" alt="" />
      <button id="startARButton" onclick="StartAR()" style="display: none">
        <img id="cameraButtonImage" src="TemplateData/CameraAssets/camera-button.png" alt="" />
      </button>
      <img id="cameraLogoImage" src="TemplateData/CameraAssets/camera-logo.png" alt="" />
    </div>
    <!-- Screenshot viewer -->
    <div id="screenshotDiv" style="display: none" class="ctaDiv">
      <div style="position: relative; background-color: #01ab01; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);">
        <img id="screenshotImg" src="" alt="screenshot" style="width: 80vw; height: 80vh"/>
        <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position: absolute; transform: translateY(-100%); right: 0; top: 0;">Close</button>
      </div>
    </div>
    <!-- Confirm URL -->
    <div id="confirmUrlDiv" style="display: none" class="ctaDiv">
      <div style="position: relative; background-color: #01ab01; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25); width: 80vw; display: flex; flex-direction: column; align-items: center;">
        <p id="confirmUrlText" style="text-align: center; width: 80%; overflow: hidden; text-overflow: ellipsis;">Are you sure you want to visit url.com?</p>
        <div>
          <button onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT SITE</button>
          <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
        </div>
      </div>
    </div>
    <!-- Error -->
    <div id="errorDiv" class="ctaDiv fade" style="background: #aaa">
      <p id="errorText" style="text-align: center; width: 60vw; color: white"></p>
    </div>
    <!-- Unity container -->
    <div id="unity-container" class="unity-mobile fade">
      <canvas id="unity-canvas" style="width: 100%; height: 100%; background: transparent; z-index: 100"></canvas>
      <div id="unity-loading-bar" class="fade">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <canvas id="video-canvas"></canvas>
    </div>
    <!-- Scripts -->
    <script src="arcamera.js"></script>
    <script src="itracker.js"></script>
    <script src="Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js"></script>
    <script>
      /* Fade helpers */
      function fadeIn(el) { el.classList.add("show"); }
      function fadeOut(el) { el.classList.remove("show"); }
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var initialize = async () => {
        var unityCanvas = document.querySelector("#unity-canvas");
        var videoCanvas = document.querySelector("#video-canvas");
        window.arCamera = new ARCamera(unityCanvas, videoCanvas);
        window.iTracker = new ImageTracker(arCamera);
        try {
          await window.iTracker.initialize("./opencv.js");
          console.log("ImageTracker initialized!");
        } catch (error) {
          console.error("Failed to initialize ImageTracker. Missing opencv.js?", error);
          ShowError("Failed to initialize the experience.");
          return;
        }
        await LoadWebcams();
        document.getElementById("startARButton").style.display = "flex";
        window.permissionsGranted = IsCameraPermissionGranted();
      };
      initialize();
      function StartAR() {
        fadeOut(document.getElementById("startARDiv"));
        createUnityInstance(canvas, {
          dataUrl: "Build/7883b95157ab90cb9ac41d15fb229039.data",
          frameworkUrl: "Build/be4bf5028a38e037133b74d79d7b5558.framework.js",
          codeUrl: "Build/426af1defc554b0f8e90e2242a4ba38f.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "AR PaylessXBINI",
          productVersion: "1.0.19",
          webglContextAttributes: { alpha: true, preserveDrawingBuffer: true }
        }, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          if(window.permissionsGranted) RequestWebcam();
          setTimeout(() => fadeOut(loadingBar), 300);
        });
        fadeIn(loadingBar);
      }
      (() => {
        const land = document.getElementById("landscape-div");
        const landImg = document.getElementById("landscape-div-img");
        const mq = matchMedia("(orientation:portrait)");
        const flip = () => {
          const isPortrait = mq.matches;
          landImg.style.opacity = isPortrait ? 0 : 1;
          land.style.zIndex = isPortrait ? "" : 9999;
        };
        flip();
        mq.addEventListener("change", flip);
      })();
		window.unityFacingMode = "environment"
      window.WEBCAM_SETTINGS = { video: { facingMode: unityFacingMode }, audio: false };
      window.requestingForPermissions = false;
      async function RequestWebcam(){
        window.requestingForPermissions = true;
        try {
          window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
          console.log("Webcam access granted");
          requestingForPermissions = false;
          StopWebcam();
        } catch (err) {
          console.error("getUserMedia error - " , err);
          ShowError("Failed to start the experience. Camera permission was denied");
          window.requestingForPermissions = false;
        }
      }
      function StopWebcam(){
        console.log("stopping camera");
        window.webcamStream.getTracks().forEach(track => track.stop());
      }
      async function StartWebcam(){
        console.log("StartWebcam")
        if (!window.webcamStream) {
          window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
        }
        const video = document.querySelector("#webcam-video");
        video.srcObject = webcamStream;
        try {
          await arCamera.startWebcam(video);
          console.log("Webcam started successfully");
          window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
        } catch(err){
          console.error("Webcam failed to start - ", err);
          window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
        }
      }
      async function LoadWebcams(){
        let camDevices = [];
        let devices = await navigator.mediaDevices.enumerateDevices();
        devices.forEach(mediaDevice => {
          if (mediaDevice.kind === 'videoinput') camDevices.push(mediaDevice);
        });
        var select = document.getElementById("chooseCamSel");
        camDevices.reverse().forEach((mediaDevice, count) => {
          const option = document.createElement('option');
          option.value = mediaDevice.deviceId;
          option.textContent = mediaDevice.label || `Camera ${count}`;
          select.appendChild(option);
        });
      }
      function SelectCam(){
        var select = document.getElementById("chooseCamSel");
        window.deviceId = select.value;
        window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
      }
      async function FlipCam(){
        fadeOut(container);
        await new Promise(r => setTimeout(r, 200));
        arCamera.stopWebcam();
        window.WEBCAM_SETTINGS.video.deviceId = '';
        if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
          window.WEBCAM_SETTINGS.video.facingMode = 'environment';
          arCamera.setFlipped(false);
        } else {
          window.WEBCAM_SETTINGS.video.facingMode = 'user';
          arCamera.setFlipped(true);
        }
        window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
        const video = document.querySelector("#webcam-video");
        video.srcObject = webcamStream;
        await arCamera.startWebcam(video);
        fadeIn(container);
      }
      async function IsCameraPermissionGranted() {
        if (!navigator.permissions || !navigator.mediaDevices) return false;
        try {
          const permissionStatus = await navigator.permissions.query({ name: "camera" });
          return permissionStatus.state === "granted";
        } catch { return false; }
      }
      function ShowError(error){
        document.getElementById("errorText").innerHTML = error;
        fadeIn(document.getElementById("errorDiv"));
      }
      function ShowScreenshot(dataUrl){
        document.getElementById("screenshotDiv").style.display = "flex";
        document.getElementById("screenshotImg").src = dataUrl;
      }
      function ShowConfirmUrl(url){
        document.getElementById("confirmUrlDiv").style.display = "flex";
        window.newUrlString = url;
        document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;
      }
      window.ITRACKER_GLOBALS = { INTERNAL_SMOOTHFACTOR_POS: .075 };
    </script>
