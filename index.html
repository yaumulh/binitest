<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AR PaylessXBINI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body, html {
    margin: 0;
    padding: 0;
    background-color: #00a650; /* hijau seperti awal */
    overflow: hidden;
    height: 100%;
  }
  #unity-container {
    width: 100%;
    height: 100%;
    position: relative;
  }
  #unity-canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
  }
  /* Fade effect */
  .fade {
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .fade.show {
    opacity: 1;
    pointer-events: all;
  }
  #loadingBar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 20px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
    overflow: hidden;
  }
  #progressBarFull {
    width: 0%;
    height: 100%;
    background: #00ff99;
    transition: width 0.2s;
  }
  #startARDiv {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    color: white;
    font-size: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
  <!-- Loading Bar -->
  <div id="loadingBar" class="fade">
    <div id="progressBarFull"></div>
  </div>
  <!-- Start AR overlay -->
  <div id="startARDiv" class="fade show" onclick="StartAR()">
    <span>Start AR</span>
  </div>
</div>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#loadingBar");
  var progressBarFull = document.querySelector("#progressBarFull");
  function fadeIn(el) { el.classList.add("show"); }
  function fadeOut(el) { el.classList.remove("show"); }
  function StartAR() {
    fadeOut(document.getElementById("startARDiv"));
    fadeIn(loadingBar);
    createUnityInstance(canvas, {
      dataUrl: "Build/7883b95157ab90cb9ac41d15fb229039.data",
      frameworkUrl: "Build/be4bf5028a38e037133b74d79d7b5558.framework.js",
      codeUrl: "Build/426af1defc554b0f8e90e2242a4ba38f.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "AR PaylessXBINI",
      productVersion: "1.0.19",
      webglContextAttributes: {
        alpha: true,
        preserveDrawingBuffer: true
      }
    }, (progress) => {
      progressBarFull.style.width = (100 * progress) + "%";
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      setTimeout(() => fadeOut(loadingBar), 300);
    }).catch((message) => {
      alert(message);
    });
  }
</script>
</body>
</html>
